          text = text.replace('- 产品、供应链和库存：参见 `03-product-supply-chain`。', '- 产品、供应链和库存：参见 [产品开发、供应链与库存](product-supply-inventory.md)。')
          text = text.replace('- 内容、达人、广告和转化：参见 `04-growth-sales`。', '- 内容、达人、广告和转化：参见 [增长营销与销售运营](growth-and-sales.md)。')
          text = text.replace('- 客户和售后：参见 `05-crm-service`。', '- 客户和售后：参见 [客户运营与售后](customer-operations.md)。')
          text = text.replace('- 数据、利润和现金流：参见 `06-data-finance`。', '- 数据、利润和现金流：参见 [数据分析与财务经营](data-and-finance.md)。')
          text = text.replace('- 项目和经营机制：参见 `07-organization`。', '- 项目和经营机制：参见 [组织协同与经营决策](organization-and-management.md)。')
          path.write_text(text, encoding='utf-8')

          path = Path('tools-and-resources.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('具体操作说明可在 `99-resources` 下按工具单独建文件，并标记最近验证日期。', '具体操作说明可在根目录按 `tool-工具名称.md` 单独建文件，并标记最近验证日期。')
          path.write_text(text, encoding='utf-8')
          PY

          rm -rf .github

      - name: Commit flattened structure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "修复平铺结构导航与链接"
          git push origin HEAD:agent/flatten-knowledge-base
