name: Flatten knowledge base

on:
  push:
    branches:
      - agent/flatten-knowledge-base

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite navigation and links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "docs/00-meta/knowledge-map.md": "knowledge-map.md",
              "docs/00-meta/contribution-guide.md": "contribution-guide.md",
              "docs/00-meta/glossary.md": "glossary.md",
              "docs/00-meta/templates/topic-template.md": "topic-template.md",
              "docs/00-meta/templates/process-template.md": "process-template.md",
              "docs/00-meta/templates/case-template.md": "case-template.md",
              "docs/01-gm/operating-system.md": "gm-operating-system.md",
              "docs/02-market-category/market-and-category.md": "market-and-category.md",
              "docs/02-market-category/tiktok-kalodata-product-selection.md": "tiktok-kalodata-product-selection.md",
              "docs/02-market-category/tiktok-kalodata-selection-deep-dive.md": "tiktok-kalodata-selection-deep-dive.md",
              "docs/03-product-supply-chain/product-supply-inventory.md": "product-supply-inventory.md",
              "docs/04-growth-sales/growth-and-sales.md": "growth-and-sales.md",
              "docs/05-crm-service/customer-operations.md": "customer-operations.md",
              "docs/06-data-finance/data-and-finance.md": "data-and-finance.md",
              "docs/07-organization/organization-and-management.md": "organization-and-management.md",
              "docs/08-tiktok/end-to-end.md": "tiktok-end-to-end.md",
              "docs/09-ai-platform/architecture.md": "ai-platform-architecture.md",
              "docs/09-ai-platform/agents.md": "ai-platform-agents.md",
              "docs/90-cases/README.md": "cases.md",
              "docs/90-cases/2026-07-kalodata-webinar-selection-notes.md": "kalodata-webinar-selection-notes.md",
              "docs/99-resources/tools.md": "tools-and-resources.md",
              "../00-meta/templates/case-template.md": "case-template.md",
              "../02-market-category/tiktok-kalodata-product-selection.md": "tiktok-kalodata-product-selection.md",
              "../02-market-category/tiktok-kalodata-selection-deep-dive.md": "tiktok-kalodata-selection-deep-dive.md",
              "../03-product-supply-chain/product-supply-inventory.md": "product-supply-inventory.md",
              "../04-growth-sales/growth-and-sales.md": "growth-and-sales.md",
              "../06-data-finance/data-and-finance.md": "data-and-finance.md",
              "../08-tiktok/end-to-end.md": "tiktok-end-to-end.md",
              "../90-cases/2026-07-kalodata-webinar-selection-notes.md": "kalodata-webinar-selection-notes.md",
          }

          for path in Path('.').glob('*.md'):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          Path('README.md').write_text('''# 跨境电商经营与 AI 产品知识库

本仓库用于系统沉淀跨境电商 GM 经营方法、TikTok 跨境业务流程、商品与供应链管理、增长营销、数据财务分析，以及 AI 电商经营平台的产品架构。

## 知识库目标

- 把零散经验拆成可检索、可复用、可持续扩展的知识单元。
- 同时服务于电商经营学习、岗位能力建设、业务方案设计和 AI 产品规划。
- 建立“战略—经营—执行—数据—系统—AI”的完整闭环。
- 所有知识文件直接平铺在仓库根目录，通过文件名和 MkDocs 导航分类。

## 核心文件

| 领域 | 文件 |
|---|---|
| 知识库说明 | [知识地图](knowledge-map.md)、[贡献规范](contribution-guide.md)、[术语表](glossary.md) |
| 文档模板 | [主题模板](topic-template.md)、[流程模板](process-template.md)、[案例模板](case-template.md) |
| GM经营 | [电商 GM 经营系统](gm-operating-system.md) |
| 市场与品类 | [市场洞察与品类管理](market-and-category.md) |
| 数据化选品 | [Kalodata 标准选品流程](tiktok-kalodata-product-selection.md)、[深度判断与竞品拆解](tiktok-kalodata-selection-deep-dive.md) |
| 产品与供应链 | [产品开发、供应链与库存](product-supply-inventory.md) |
| 增长与销售 | [增长营销与销售运营](growth-and-sales.md) |
| 客户运营 | [客户运营与售后](customer-operations.md) |
| 数据与财务 | [数据分析与财务经营](data-and-finance.md) |
| 组织管理 | [组织协同与经营决策](organization-and-management.md) |
| TikTok全流程 | [TikTok 跨境电商端到端流程](tiktok-end-to-end.md) |
| AI平台 | [AI 电商经营平台架构](ai-platform-architecture.md)、[AI 智能体能力清单](ai-platform-agents.md) |
| 案例与来源 | [案例库说明](cases.md)、[Kalodata 演示会笔记](kalodata-webinar-selection-notes.md) |
| 工具资源 | [工具与数据源](tools-and-resources.md) |

## 推荐阅读路线

### 电商经营路线

1. [电商 GM 经营系统](gm-operating-system.md)
2. [市场洞察与品类管理](market-and-category.md)
3. [TikTok 数据化选品流程](tiktok-kalodata-product-selection.md)
4. [产品开发、供应链与库存](product-supply-inventory.md)
5. [增长营销与销售运营](growth-and-sales.md)
6. [客户运营与售后](customer-operations.md)
7. [数据分析与财务经营](data-and-finance.md)
8. [组织协同与经营决策](organization-and-management.md)

### TikTok 跨境路线

1. [TikTok 跨境电商端到端流程](tiktok-end-to-end.md)
2. [Kalodata 标准选品流程](tiktok-kalodata-product-selection.md)
3. [选品深度判断与竞品拆解](tiktok-kalodata-selection-deep-dive.md)
4. [Kalodata 演示会来源笔记](kalodata-webinar-selection-notes.md)

### AI 产品经理路线

1. [AI 电商经营平台架构](ai-platform-architecture.md)
2. [AI 智能体与能力清单](ai-platform-agents.md)
3. 将经营流程映射为业务对象、数据、系统、工作流和智能体能力。

## 扩展规则

新增知识文件时直接放在仓库根目录，使用小写英文和连字符命名。专题、流程和案例分别参考对应模板，不再创建多层目录。

## 本地预览

```bash
pip install mkdocs-material
mkdocs serve
```
