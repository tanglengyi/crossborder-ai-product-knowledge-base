''', encoding='utf-8')

          path = Path('knowledge-map.md')
          text = path.read_text(encoding='utf-8')
          start = text.index('## 5. 文件归属规则')
          end = text.index('## 6. 扩展原则')
          replacement = '''## 5. 文件归属规则

所有文件均放在仓库根目录，通过稳定的文件名前缀表达归属：

- `gm-`：跨模块经营总方法论。
- `market-`、`tiktok-kalodata-`：市场、品类与数据化选品。
- `product-`：产品开发、采购、物流和库存。
- `growth-`：内容、达人、广告、Listing 和促销。
- `customer-`：客服、评价、会员和复购。
- `data-`：指标、BI、成本、利润和现金流。
- `organization-`：团队、协同、年度规划和复盘。
- `tiktok-`：TikTok 端到端流程与专项方法。
- `ai-platform-`：系统架构、AI能力和智能体。
- 日期开头或明确来源名称：案例、会议记录和复盘。

'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          path = Path('contribution-guide.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('目录和文件统一使用小写英文与连字符', '文件统一使用小写英文与连字符')
          text = text.replace('参见 [数据分析与财务经营](../06-data-finance/data-and-finance.md)。', '参见 [数据分析与财务经营](data-and-finance.md)。')
          text = text.replace('同一主题不要按日期反复新建文件', '除案例和会议记录外，同一主题不要按日期反复新建文件')
          path.write_text(text, encoding='utf-8')

          path = Path('cases.md')
          text = path.read_text(encoding='utf-8')
          start = text.index('## 1. 推荐目录')
          end = text.index('## 2. 文件命名')
          replacement = '''## 1. 平铺管理方式

案例文件直接放在仓库根目录，不再按市场、品类或职能建立文件夹。通过文件名表达时间、平台、国家、品类和问题，必要时在文首增加标签。

推荐前缀：

- `case-`：一般经营案例。
- `failure-`：失败案例和重大教训。
- `YYYY-MM-`：有明确发生时间的项目、会议或复盘。
- `source-`：外部课程、会议和资料来源笔记。

'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('[案例模板](../00-meta/templates/case-template.md)', '[案例模板](case-template.md)')
          path.write_text(text, encoding='utf-8')

          path = Path('tiktok-end-to-end.md')
