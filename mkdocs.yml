repo_url: https://github.com/tanglengyi/crossborder-ai-product-knowledge-base
repo_name: tanglengyi/crossborder-ai-product-knowledge-base
docs_dir: .
site_dir: ../crossborder-ai-product-knowledge-base-site

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true

